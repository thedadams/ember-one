theme = "custom"

[custom_theme]
base = "github-light-default"
label = "Ember One Light"

background = "#F7F5F0"
panel = "#F0EEE8"
panelAlt = "#E7E4DC"
border = "#C8C2B7"

accent = "#A9561F"
